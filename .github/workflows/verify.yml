name: Website validation

on:
  pull_request:
  push:
    branches:
      - feat/faq-content-final-2026-11-04

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - name: Install exact dependencies
        run: npm ci
      - name: Build, test and validate
        run: npm run check
      - name: Verify generated FAQ blocks
        run: python3 tools/build_faq.py --check-only
