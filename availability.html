<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123c55" />
  <meta name="robots" content="noindex,follow" />
  <meta name="description" content="Live availability and direct-booking rates for Villas Pastura in Novalja." />
  <title>Availability & prices | Villas Pastura</title>
  <link rel="icon" href="assets/icons/favicon.svg?v=1.16.2" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico?v=1.16.2" sizes="any" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png?v=1.16.2" />
  <link rel="manifest" href="assets/icons/site.webmanifest?v=1.16.2" />
  <link rel="stylesheet" href="assets/css/booking-flow.css?v=1.25.0" />
  <link rel="stylesheet" href="assets/css/consent.css?v=1.16.2" />
  <script type="module" src="assets/js/availability.js?v=1.25.0"></script>
  <script type="module" src="assets/js/privacy.js?v=1.16.2"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="flow-header">
    <div class="flow-container flow-header-inner">
      <a class="flow-brand" href="index.html">
        <strong>Private Pool Villas Pastura</strong>
        <small>Novalja, Pag Island</small>
      </a>
      <div class="flow-actions">
        <a class="flow-back" href="index.html#booking" data-change-stay data-copy="change">Change dates or guests</a>
        <label>
          <span class="sr-only">Language</span>
          <select class="flow-language" id="language-select" aria-label="Language">
            <option value="en">EN</option><option value="de">DE</option><option value="hr">HR</option><option value="it">IT</option>
          </select>
        </label>
      </div>
    </div>
  </header>

  <main class="flow-main" id="main">
    <div class="flow-container">
      <h1 class="flow-title flow-title-compact" data-copy="title">Review and complete your booking</h1>

      <section class="stay-summary" id="stay-summary" aria-label="Selected stay" hidden></section>

      <div class="flow-status" id="search-status" role="status">
        <div class="loading-line"></div><div class="loading-line"></div>
        <p data-copy="loading">Checking the latest availability and prices…</p>
      </div>

      <section class="offer-list" id="offer-list" aria-live="polite" aria-label="Available offers"></section>
    </div>
  </main>

  <footer class="flow-footer">
    <div class="flow-container flow-footer-inner">
      <span>© <span id="year"></span> Villas Pastura</span>
      <nav aria-label="Legal"><a href="privacy.html">Privacy</a><a href="cookies.html">Cookies</a><a href="booking-terms.html">Booking terms</a></nav>
    </div>
  </footer>
</body>
</html>
